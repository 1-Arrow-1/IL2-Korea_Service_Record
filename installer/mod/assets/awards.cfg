// Параметры:
// name= - имя награды, не понятно точно зачем нужно, но может пригодиться. Задавать равным английской локализации
// AwardCombo= - Числовой параметр, кол-во наград, выдаваемых в одном вылете, в случае если условие AwardInProc выполнено. В качестве значения могут использоваться числовые аргументы применяемые в AwardInProc. Если параметр задан и больше нуля, то награда может выдаваться повторно неограниченное число раз.
// AwardInProc= - Условие награждения в процессе карьеры
// AwardInProc2= - Условие награждения во 2й раз
// AwardInProc3= - Условие награждения во 3й раз
// AwardInProc4= - Условие награждения во 4й раз
// AwardInProc5= - Условие награждения во 5й раз
// AwardByDef= - Условие награждения по умолчанию (перед началом службы) при создании персонажа
// AwardPrewVer="101001" - Указание награды этого же типа, но старой (относительно текущей) модели, нужно для работы AwardInProc2..5 и недублирования AwardByDef.
// RequiredAward= - Требования наличия другой награды для выдачи этой
// RequiredAward2= - Требования наличия другой награды для выдачи этой
// RequiredAward3= - Требования наличия другой награды для выдачи этой
// AwardRemove="(ExAw=...)|(ExAw=...)" - перечень наград, которые следует удалить при наличии той, в которой задан параметр

// Аргументы параметров из РоФа:
// CDate (YYYYMMDD) - текущая дата
// Country - страна
// RankID - звание, от 0 до 5
// PCP - кол-во карьерных очков
// WIA - кол-во раненений персонажа
// WarEnd - война окончилась
// FlTime - налет
// Sorties - кол-во боевых вылетов
// ComplSorties - колво успешных боевых вылетов
// AirObj - Убил самолетов всего
// GrObj - Убил наземной техники всего
// SeaObj - Убил кораблей всего
// BldObj - Убил строений всего
// AirObjSortie - Убил самолетов за крайний вылет
// GrObjSortie - Убил наземной техники за крайний вылет
// SeaObjSortie - Убил кораблей за крайний вылет
// BldObjSortie - Убил строений за крайний вылет
// RND - рандомное число от 0 до 1000, вычисляется при расчете каждой награды

// Новые аргументы параметров:
// RNDsortie - рандомное число от 0 до 1000, вычисляется единожды при завершении миссии
// SeaSmallObj - Убил малых кораблей всего
// SeaCargoObj - Убил транспортных кораблей всего
// SeaDestrObj - Убил эсминцев всего
// SeaSubObj - Убил подводных лодок всего
// TankObj - Убил танков всего
// FghtObj - Убил самолетов истребителей всего
// BmbrObj - Убил транспортных самолетов всего
// TrnsObj - Убил транспортных самолетов
// SeaSmallObjSortie - Убил малых кораблей за крайний вылет
// SeaCargoObjSortie - Убил транспортных кораблей за крайний вылет
// SeaDestrObjSortie - Убил эсминцев за крайний вылет
// SeaSubObjSortie - Убил подводных лодок за крайний вылет
// TankObjSortie - Убил танков за крайний вылет
// FghtObjSortie - Убил самолетов истребителей за крайний вылет
// BmbrObjSortie - Убил транспортных самолетов за крайний вылет
// TrnsObjSortie - Убил транспортных самолетов за крайний вылет
// CareerDays - Кол-во дней в карьере всего
// SquadronID - ID полка
// IsCommander - Персонаж - командир на момент проверки (bool)
// IsPlayer - Персонаж - игрок (bool)
// WIASortie - Ранен в крайнем вылете (bool)
// BattleEnd - окончилась карьера на ТВД с заданным ID (BattleEnd=13)
// noAwards=1 - проверка, что такая награда в этом вылете еще не выдавалась

// Операции:
// AwardInProc="(A)&(B)" - Если A и B то true.
// AwardInProc="(A)|(B)" - Если A или B то true.
// AwardInProc="(A)&(~(B))" - Если A и не B то true.
// AwardInProc="(A=B)" - Если A равно B то true.
// AwardInProc="(A!=B)" - Если A не равно B то true.
// AwardInProc="(A>B)" - Если A больше B то true.
// AwardInProc="(A<B)" - Если A меньше B то true.
// AwardInProc="(A>=B)" - Если A больше либо равно B то true.
// AwardInProc="(A<=B)" - Если A меньше либо равно B то true.
// AwardInProc="(A+B)=C" - Если A плюс B равно C то true.
// AwardInProc="(A-B)=C" - Если A минус B равно C то true.
// AwardInProc="(A*B)=C" - Если A умножить на B равно C то true.
// AwardInProc="(A/B)=C" - Если A делить на B равно C то true.

// New Korea
// DaysTotal - Кол-во дней от начала карьеры до конца войны. Пример - 500. Не для реалистичных условий, т.к. заглядывает в будущее...
// DaysLeft - Кол-во дней оставшееся до конца войны. Пример - 200. Но может быть полезно при расчёте игровых наград
// Progress - Прогресс карьеры до конца войны. Пример - 30. Целое число в процентах от 0 до 100
// DaysPromoted - Кол-во дней с крайнего повышения. Пример - 10.
// DaysAwarded - Кол-во дней с крайнего вручения награды. Пример - 5.
// ServiceDays - Кол-во дней с момента поступления в полк. В отличие от CareerDays считается индивидуально для каждого пилота.
// Efficiency - Эффективность полка. Пример - 2, диапозон - 0...3, только при расчёте наград полка
// OpTotal - Кол-во операций, в которых участвовал полк/пилот. Пример - 4. Для полка учитываются в т.ч. операции, в которых не было совершено ни одного вылета.
// OpSuccess - Кол-во успешных операций, в которых участвовал полк/пилот. Пример - 2.
// OpN - Признак успешного участия в операции N. Пример - 1. Для полка это 0 или 1, для пилота это количество успешных миссий в операции

// OpEnd111 - скрытая операция,где 111 - номер скрытой операции, описывается в файле operations.cfg, если в период карьеры попадает дата окончании операции, то принимает значение раное 1.
// IsPromotion=1 ставится для фейковых наград, которые нужны для повышения пилота. При выполнении условия в такой награде появляется возможность повышения звания для бота, или сразу же повышается звание игрока. Среди медалей такая награда не видна.
// IsSquadron=1 задумывалось как награда, вручаемая полку целиком, но я не уверен есть ли такие награды среди запланированных. Возможно как раз что-то такое можно было бы использовать для демонстрации успешности в карьере.