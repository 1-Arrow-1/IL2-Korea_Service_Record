// Unit citation - awarded to the squadron as a whole, not to a pilot.
//
// IsSquadron=1 is described in the legend as conceived but unconfirmed. It
// works: proven 1951.07.02, when a probe with a trivially true condition
// produced one award row of category 2 with pilotId -1 and the squadronId,
// an event of type 21, and "[INFO] Award for Squadron Type:601042" in the
// career log. It fires in the day-rollover sweep and is never held pending.
//
// In this path the variables are the squadron's: ComplSorties counts the
// unit's missions (78 in a three-month career), AirObj and GrObj are the
// unit's totals, and Efficiency (0..3) is defined here and nowhere else.
//
// Two kinds of unit award, as a Korean War wing actually held them. The DUC
// is the unit's Distinguished Service Cross, the ROK PUC the long-service one
// given by Syngman Rhee to nearly every UN air unit. Both must be written on
// the running totals of the squadron: the per-sortie tokens (AirObjSortie,
// GrObjSortie, ...) are a hard 0 in the squadron path - the engine passes an
// empty sortie record - so a single-mission criterion can never fire
// (decompiled and confirmed in game, 1951.04.17). The DUC therefore marks the
// point where a unit at full efficiency has destroyed 25 aircraft, or 300
// vehicles, vessels and buildings; the cluster 60 / 800. GrObj is vehicles,
// guns and parked aircraft, BldObj buildings.

[Award=601042]
	name="Distinguished Unit Citation"
	IsSquadron=1
	AwardInProc="(Country=601)&(Efficiency>=3)&((AirObj>=50)|((GrObj+BldObj+SeaObj)>=600))"
	AwardByDef="(RND<0)"
[end]

[Award=601043]
	name="Republic of Korea Presidential Unit Citation"
	IsSquadron=1
	AwardInProc="((Country=601)|(Country=602)|(Country=603))&(Efficiency>=3)&(ComplSorties>=100)"
	AwardByDef="((Country=601)|(Country=602)|(Country=603))&(Efficiency>=3)&(ComplSorties>=100)"
[end]

