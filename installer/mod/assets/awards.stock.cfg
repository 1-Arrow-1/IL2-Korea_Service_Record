// Bronze Star Medal with "V" device - the same medal, awarded for heroism.
// Army regulations in force in 1950 put one bronze V on the ribbon for an
// award made for valour, worn once however many valorous awards follow;
// every further Bronze Star, for merit or for valour, adds a cluster. So a
// pilot has two things to track - how many awards, and whether any was for
// valour - and the ladder below runs beside the merit one (601008-601010).
//
// The engine can only ask "does he hold X" through RequiredAward, and one
// rung cannot apply a different condition per alternative, so a rung that
// is reached by two routes has two ids sharing one tile and one name:
// 601059/601061 are both "V and one cluster", 601060/601062 both "V and two".
// Every rung removes all lower rungs of both ladders, which is how a merit
// holder who does something brave moves sideways-and-up (BSM -> V+1) and a
// V holder who reaches 35 sorties gets his cluster without losing the V: the
// merit thresholds sit one rung lower here, since his first merit award is
// already his second Bronze Star. 601008 keeps re-firing for a V holder -
// it has no prerequisite - and the V rungs retire it again in the same pass.
//
// Valour, below the Silver Star band (2-3 kills): one air kill (30%), a
// heavy strike of 25+ ground targets in one sortie (20%), or wounded and
// still scoring (40%). About three a season for an aggressive player.
[Award=601058]
	name="Bronze Star Medal with V Device"
	AwardInProc="(Country=601)&(CDate>=19440204)&(((AirObjSortie=1)&(RND<300))|(((GrObjSortie+BldObjSortie)>=25)&(RND<200))|((WIASortie)&((AirObjSortie+GrObjSortie+BldObjSortie)>=1)&(RND<400)))"
	AwardByDef="(RND<0)"
[end]

[Award=601059]
	name="Bronze Star Medal with V Device and One Oak Leaf Cluster"
	RequiredAward="601058"
	AwardInProc="(Country=601)&(CDate>=19440204)&((((AirObjSortie=1)&(RND<300))|(((GrObjSortie+BldObjSortie)>=25)&(RND<200))|((WIASortie)&((AirObjSortie+GrObjSortie+BldObjSortie)>=1)&(RND<400)))|(ComplSorties>=35))"
	AwardByDef="(RND<0)"
	AwardRemove="(ExAw=601008)|(ExAw=601058)"
[end]

