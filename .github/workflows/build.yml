# Clean-machine CI build for the Windows release.
#
# Public release binaries are built and Azure Artifact Signed locally with
# tools/build_release.ps1. That is deliberate: the public build uses the
# locally rebuilt PyInstaller bootloader documented in CLAUDE.md, while the
# GitHub-hosted runner installs the stock PyInstaller bootloader from PyPI.
#
# CI therefore proves that the tree builds and keeps unsigned workflow
# artifacts for inspection. A v* tag also opens the GitHub release, but the
# signed Setup.exe and ZIP are uploaded from the local release build.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pystray==0.19.5 pyinstaller==6.17.0

      - name: Validate repository
        run: python tools/validate.py

      - name: Build the tracker (PyInstaller)
        run: pyinstaller korea_service_record.spec --noconfirm

      - name: Smoke-test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IL2_Korea_Service_Record\IL2_Korea_Service_Record.exe `
               -ArgumentList "--console","--port","5010","--no-browser","--game","$env:RUNNER_TEMP" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          try { $r = Invoke-WebRequest -Uri http://127.0.0.1:5010/api/ping -UseBasicParsing; "ping $($r.StatusCode)" }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Stage and build unsigned CI installer
        shell: pwsh
        run: |
          python tools/stage_release.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\IL2_Korea_Service_Record.iss

      - name: Make unsigned CI release zip
        run: python tools/make_release_zip.py

      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ci-release
          path: |
            installer/Output/*.zip
            installer/Output/*.exe
          if-no-files-found: error

      # The release itself is created here but deliberately receives no
      # binaries. Run tools/build_release.ps1 locally, push the tag, let this
      # job create the release, then upload the signed assets with:
      #
      #   .\tools\build_release.ps1 -UploadRelease
      #
      # or use gh release upload manually.
      - name: Publish release shell
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
