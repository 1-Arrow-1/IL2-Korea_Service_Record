<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Diary</title>
    <link rel="icon" href="/static/images/icon.png?v=__ASSET_VERSION__">
    <link rel="stylesheet" href="/static/css/main.css?v=__ASSET_VERSION__">
    <link rel="stylesheet" href="/static/css/diary.css?v=__ASSET_VERSION__">
</head>
<body class="diary-page">
    <!-- The squadron's war diary: the career day by day, assembled out of
         the events the game recorded and nothing else. Its own page rather
         than another panel, because the service record already carries
         fifteen of them. -->
    <div class="diary-bar no-print">
        <a id="wd-back" class="nav-btn" href="/">&larr; <span data-i18n="diary.back">Service Record</span></a>
        <span id="wd-note" class="wd-note"></span>
        <button id="wd-print" class="nav-btn" data-i18n="diary.print">Print</button>
    </div>
    <main id="wd-sheet">
        <!-- The bound head of the book. Only the top: the fray hangs
             downward, so a mirrored copy at the foot would point upward
             and read as a second, impossible binding. -->
        <div class="wd-edge" aria-hidden="true"></div>
        <!-- The service's seal, struck blind in the corner the way a
             cover sheet carries one. Decoration, so it is hidden from
             anything reading the page aloud. -->
        <img id="wd-seal" class="wd-seal" alt="" aria-hidden="true" hidden>
        <header class="wd-head">
            <div class="wd-head-top">
                <img id="wd-emblem" class="wd-emblem" alt="" aria-hidden="true" hidden>
                <p id="wd-sub" class="wd-sub"></p>
                <img id="wd-plane" class="wd-plane" alt="" aria-hidden="true" hidden>
            </div>
            <!-- The engraved letterhead. Its rosettes reach in from both
                 ends, leaving the middle 41% clear; the title is fitted to
                 that span rather than allowed to run into the scrollwork. -->
            <div class="wd-letterhead">
                <h1 id="wd-title" data-i18n="diary.title">War Diary</h1>
            </div>
        </header>
        <ol id="wd-days" class="wd-days"></ol>
    </main>
    <p id="wd-state" class="state-message" hidden></p>
<script src="/static/js/i18n.js?v=__ASSET_VERSION__"></script>
<script src="/static/js/diary.js?v=__ASSET_VERSION__"></script>
</body>
</html>
