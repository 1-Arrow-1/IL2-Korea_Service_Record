  <title>People's Republic of China</title>
  <defs>
    <filter id="fraycn" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.16"
                    numOctaves="4" seed="209" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"
