<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"
     role="img" aria-label="Soviet Union">
  <title>Soviet Union</title>
  <defs>
    <filter id="fraysu" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.16"
                    numOctaves="4" seed="232" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="stainsu" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035"
                    numOctaves="5" seed="239"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="foldsu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.16"/>
      <stop offset="14%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="46%"  stop-color="#000" stop-opacity="0.10"/>
      <stop offset="62%"  stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="88%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clipsu"><rect width="60.0" height="40.0"/></clipPath>
  </defs>
  <g filter="url(#fraysu)">
    <rect width="60" height="40" fill="#9c3129"/>
    <polygon points="19.40,1.70 20.01,3.57 21.97,3.57 20.38,4.72 20.99,6.58 19.40,5.43 17.81,6.58 18.42,4.72 16.83,3.57 18.79,3.57" fill="#dcb548"/>
    <g transform="translate(3.6,5.6) scale(0.132)" fill="#dcb548">
      <path d="M10 92 A 66 66 0 0 1 90 12 L 83 31 A 48 48 0 0 0 28 92 Z"/>
      <rect x="3" y="85" width="27" height="13" rx="3"/>
      <g transform="rotate(-45 20 90)">
        <rect x="20" y="84" width="48" height="13" rx="2"/>
        <rect x="62" y="70" width="20" height="40" rx="3"/>
      </g>
    </g>
  </g>
  <g clip-path="url(#clipsu)">
    <rect width="60" height="40" filter="url(#stainsu)"
          opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="60" height="40" fill="url(#foldsu)"/>
  </g>
</svg>
