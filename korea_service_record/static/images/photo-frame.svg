<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 245"
     preserveAspectRatio="none" aria-hidden="true">
  <!--
    Photograph well for a service identity document: a ruled double border,
    corner brackets where a print would be mounted, and registration ticks at
    the mid-points. Drawn as an overlay with no fill, so the portrait shows
    through and the frame sits on top of it.

    preserveAspectRatio="none" lets one file stretch to whatever the portrait
    box is, which keeps the border weight even rather than scaling the strokes.
  -->
  <g fill="none" stroke="#2c2212" stroke-opacity="0.55">
    <!-- double rule -->
    <rect x="3" y="3" width="194" height="239" stroke-width="2"/>
    <rect x="8" y="8" width="184" height="229" stroke-width="0.75"/>
  </g>

  <!--
    Corner brackets. The print is inset 10px, so these sit at 11 — hugging its
    corners the way mounting corners do, without reaching across the face.
  -->
  <g fill="none" stroke="#2c2212" stroke-opacity="0.8" stroke-width="2.5"
     stroke-linecap="square">
    <path d="M11 30 V11 H30"/>
    <path d="M170 11 H189 V30"/>
    <path d="M189 215 V234 H170"/>
    <path d="M30 234 H11 V215"/>
  </g>

  <!-- registration ticks -->
  <g fill="none" stroke="#2c2212" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M100 3 V11"/>
    <path d="M100 234 V242"/>
    <path d="M3 122.5 H11"/>
    <path d="M189 122.5 H197"/>
  </g>
</svg>
